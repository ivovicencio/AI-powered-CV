<footer class="site-footer">
  <div class="container-fluid px-4">
    <section class="suggestion-box" aria-labelledby="suggestion-title">
      <div class="suggestion-copy">
        <span class="suggestion-kicker">Ayúdanos a mejorar</span>
        <h2 id="suggestion-title">¿Qué te gustaría cambiar o sumar?</h2>
        <p>Tu sugerencia se abrirá en WhatsApp. No se envía hasta que la confirmes ahí.</p>
      </div>
      <div class="suggestion-form">
        <label class="visually-hidden" for="suggestion-message"
          >Escribí tu sugerencia para CVOLVE</label
        >
        <textarea
          id="suggestion-message"
          rows="2"
          maxlength="1000"
          placeholder="Contanos qué mejorarías..."
          [ngModel]="suggestion()"
          (ngModelChange)="suggestion.set($event)"
        ></textarea>
        <button type="button" [disabled]="!suggestion().trim()" (click)="sendSuggestion()">
          <i class="bi bi-whatsapp" aria-hidden="true"></i>
          Enviar sugerencia
        </button>
      </div>
    </section>

    <div class="footer-inner">
      <div class="footer-credit">
        <span>Hecho por <strong>Ivo Vicencio - ViroTech</strong></span>
        <span class="footer-separator" aria-hidden="true">·</span>
        <span>© {{ year }}</span>
        <span class="footer-separator" aria-hidden="true">·</span>
        <a
          href="https://github.com/ivovicencio/AI-powered-CV"
          target="_blank"
          rel="noopener noreferrer"
          >Open source en GitHub</a
        >
      </div>

      <nav class="footer-socials" aria-label="Redes sociales de Ivo Vicencio">
        @for (social of socials; track social.label) {
          <a
            class="social-link"
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="social.label"
            [attr.title]="social.label"
          >
            <i class="bi {{ social.icon }}" aria-hidden="true"></i>
          </a>
        }
      </nav>
    </div>
  </div>
</footer>
